<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>准备模型</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: grid; place-items: center;
        background: #09090b; color: #e4e4e7;
        font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      main { width: 520px; padding: 28px 30px; }
      h1 { font-size: 17px; margin: 0 0 4px; }
      p { margin: 0 0 16px; color: #a1a1aa; font-size: 12.5px; }
      code {
        background: #18181b; border: 1px solid #27272a; border-radius: 4px;
        padding: 1px 5px; font: 11.5px ui-monospace, Consolas, monospace;
        word-break: break-all;
      }
      .row { display: flex; justify-content: space-between; font-size: 12px; color: #a1a1aa; margin-bottom: 6px; }
      .bar { height: 8px; border-radius: 99px; background: #18181b; overflow: hidden; border: 1px solid #27272a; }
      .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6366f1, #818cf8); transition: width .2s; }
      .actions { margin-top: 20px; display: flex; gap: 10px; }
      button {
        font: inherit; font-size: 13px; padding: 8px 16px; border-radius: 8px;
        border: 1px solid #3f3f46; background: #18181b; color: #e4e4e7; cursor: pointer;
      }
      button.primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
      button:disabled { opacity: .5; cursor: default; }
      .err { color: #fca5a5; font-size: 12px; margin-top: 10px; min-height: 16px; }
      .ok { color: #6ee7b7; }
      .hint { font-size: 11.5px; color: #71717a; margin-top: 14px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">首次启动：准备模型</h1>
      <p id="desc">需要下载 EmbeddingGemma 2（Q8_0，约 310 MB）到本地数据目录，只需一次。</p>

      <div class="row"><span id="status">等待开始</span><span id="pct"></span></div>
      <div class="bar"><i id="fill"></i></div>
      <div class="err" id="err"></div>

      <div class="actions">
        <button class="primary" id="go">开始下载</button>
        <button id="retry" class="hidden">重试</button>
        <button id="next" class="hidden">进入应用</button>
      </div>

      <div class="hint" id="runtime"></div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      let missingRuntime = false;

      window.desktop.setup.onState((state) => {
        missingRuntime = state.missingRuntime;
        $('runtime').innerHTML = missingRuntime
          ? `⚠ 未找到 llama.cpp 运行时：<code>${state.runtimeDir}</code><br/>请先执行 <code>desktop/scripts/fetch-runtime.mjs</code> 或安装完整包。`
          : `模型将保存到 <code>${state.modelFile}</code>`;
        if (missingRuntime) {
          $('go').disabled = true;
          $('desc').textContent = '缺少推理运行时，无法启动。';
        }
      });

      window.desktop.setup.onProgress((p) => {
        const mb = (p.received / 1e6).toFixed(1);
        const total = p.total ? (p.total / 1e6).toFixed(1) : '?';
        $('status').textContent = `下载中 ${mb} / ${total} MB`;
        $('pct').textContent = p.percent != null ? `${p.percent}%` : '';
        $('fill').style.width = p.percent != null ? `${p.percent}%` : '15%';
      });

      window.desktop.setup.onDone((r) => {
        $('go').classList.add('hidden');
        if (r.ok) {
          $('status').textContent = '下载完成';
          $('status').className = 'ok';
          $('fill').style.width = '100%';
          $('next').classList.remove('hidden');
        } else {
          $('status').textContent = '下载失败';
          $('err').textContent = r.error || '未知错误';
          $('retry').classList.remove('hidden');
        }
      });

      $('go').onclick = () => {
        $('go').disabled = true;
        $('status').textContent = '连接中…';
        $('err').textContent = '';
        window.desktop.setup.download();
      };
      $('retry').onclick = () => {
        $('retry').classList.add('hidden');
        $('go').disabled = true;
        $('err').textContent = '';
        window.desktop.setup.download();
      };
      $('next').onclick = () => window.desktop.setup.continue();
    </script>
  </body>
</html>
