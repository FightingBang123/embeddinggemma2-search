# 轻量包：不带模型（约 198 MB），首次启动时向导下载 GGUF 到 userData。
#   npm run dist:win:slim
# 默认包（electron-builder.yml）已内置模型，安装后无需联网。
appId: com.pzibang.embeddinggemma2
productName: EmbeddingGemma2
copyright: Copyright © 2026 pzibang

directories:
  output: ../release/desktop-slim
  buildResources: build

npmRebuild: false
electronDist: node_modules/electron/dist

files:
  - src/**/*
  - package.json
  - '!**/*.map'

asarUnpack:
  - node_modules/pdf-parse/**/*

# 解压目录里附带的启动/安装脚本。
# 用户双击的 EmbeddingGemma2.exe / EmbeddingGemma2App.exe 都是同一个启动器，
# 真正的 Electron 主程序叫 EmbeddingGemma2Core.exe（见 win.executableName）。
extraFiles:
  - from: extra/EmbeddingGemma2.exe
    to: EmbeddingGemma2.exe
  - from: extra/EmbeddingGemma2App.exe
    to: EmbeddingGemma2App.exe
  - from: extra/Install.cmd
    to: Install.cmd
  - from: extra/Install.ps1
    to: Install.ps1
  - from: extra/Run.cmd
    to: Run.cmd
  - from: extra/Run.ps1
    to: Run.ps1
  - from: extra/README.txt
    to: README.txt

extraResources:
  - from: resources/runtime
    to: runtime
  - from: ../release/web
    to: web

win:
  icon: build/icon.ico
  # 真正的 Electron 主程序；用户双击的 EmbeddingGemma2.exe / EmbeddingGemma2App.exe
  # 都是 extraFiles 里的启动器。
  executableName: EmbeddingGemma2Core
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-slim-${arch}.${ext}
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EmbeddingGemma 2
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-mac-slim-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false

linux:
  icon: build/icon.png
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
  artifactName: ${productName}-${version}-linux-slim-${arch}.${ext}
